<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Оплата аренды</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f3f5f2; color: #20251f; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(520px, 100%); padding: 40px; box-sizing: border-box; background: #fff; border: 1px solid #dfe4dc; border-radius: 20px; box-shadow: 0 16px 44px rgba(24, 38, 27, .08); }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #626b62; line-height: 1.55; }
    strong { color: #243729; }
  </style>
</head>
<body>
  <main>
    <h1>Оплата аренды</h1>
    <p>Платёжные документы и договоры направляются с адреса <strong>payments@oplatakladov.ru</strong>. Для оплаты используйте QR-код и реквизиты из полученного письма.</p>
  </main>
</body>
</html>
