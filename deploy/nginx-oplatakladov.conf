server {
    listen 80;
    listen [::]:80;
    server_name oplatakladov.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/oplatakladov;
        try_files $uri =404;
    }

    location / {
        return 301 https://oplatakladov.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oplatakladov.ru;

    ssl_certificate /etc/letsencrypt/live/oplatakladov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oplatakladov.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/oplatakladov;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /telegram/webhook {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3000/api/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
